name: Update Purple Space Shooter

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this fork
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Generate GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-space-shooter mahmoudewies --output game.gif --strategy random --fps 40
      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.gif
          git diff --cached --quiet || git commit -m "chore: update purple space shooter"
          git push
