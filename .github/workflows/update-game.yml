name: Update NEON MAZE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-game.yml'
      - 'src/**'
      - 'pyproject.toml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-neon-maze
  cancel-in-progress: false

jobs:
  update-maze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Generate NEON MAZE from GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret GH_TOKEN is missing. Add a token with read:user permission."
            exit 1
          fi
          gh-space-shooter mahmoudewies --game maze --output assets/neon-maze.gif
      - name: Commit generated animation when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neon-maze.gif
          git diff --cached --quiet || git commit -m "chore: update NEON MAZE animation"
          git push
